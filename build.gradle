plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.3'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'org.cyclonedx.bom' version '1.8.2'
}

group = 'com.example'
version = '1.0.0'
description = 'Spring Boot 3.3 SBOM Demo (Java 21, Gradle)'
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Extra dependencies to show up in SBOM (security/compliance demo)
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'com.google.guava:guava:33.2.1-jre'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Database driver (runtime)
    runtimeOnly 'org.postgresql:postgresql:42.7.4'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// Generate CycloneDX SBOM via: ./gradlew cyclonedxBom
cyclonedxBom {
    // includeConfigs defaults to "runtimeClasspath", which is fine for apps
    // Optionally add project type metadata
    projectType = "application"
    // To include license text if available
    includeLicenseText = true
}

